name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Arrow + Parquet, C++17)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell so the conda environment is activated for every step.
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda (miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Install Arrow + Parquet + toolchain
        run: conda install -y -c conda-forge libarrow-all cmake cxx-compiler make

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        run: cmake --build build -j
